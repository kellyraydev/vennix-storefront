name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Storefront, Shopify data layer, theme and end-to-end checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Keep going when one runtime fails: the two versions here are the
      # supported floor and the version that actually ships (vercel.json →
      # nodejs24.x), and both answers are useful.
      fail-fast: false
      matrix:
        node: ['20.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # jsdom is a dev-only dependency for the browser click test; the app
      # itself stays dependency-free.
      - name: Install browser test harness
        run: npm install --no-save --no-audit --no-fund jsdom

      - name: Module load check
        run: npm run check

      # Shopify data-access layer exercised against the mock Storefront-API
      # gateway (same wire format as production, offline).
      - name: Shopify data layer tests
        run: npm run test:shopify

      # Configuration sanity: mode, API version, proxy/CSP expectations,
      # repository metadata, legacy isolation.
      - name: Configuration doctor
        run: npm run doctor

      # Nothing that ships may hold a credential, and no response may echo one.
      - name: Secret scan (static + runtime)
        run: npm run secrets

      - name: Theme structure check
        run: npm run theme:check

      # Every one of these boots its own throwaway server on an ephemeral
      # port, so order does not matter and state cannot leak between them.
      - name: Render check
        run: npm run check:render

      - name: HTTP end-to-end suite
        run: npm run smoke

      - name: Storefront feature suite
        run: npm run features

      - name: Dead-link crawl
        run: npm run links

      - name: Accessibility check
        run: npm run a11y

      - name: Browser click test
        run: npm run browser:test

  verify-live:
    name: Live Shopify verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs only when real store credentials are configured as repository
    # secrets: SHOPIFY_STORE_DOMAIN and SHOPIFY_STOREFRONT_ACCESS_TOKEN.
    if: ${{ github.event_name != 'pull_request' && secrets.SHOPIFY_STORE_DOMAIN != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # the runtime that ships (vercel.json -> nodejs24.x): verify:live must
          # prove the store works on THAT runtime, not on an older one.
          node-version: '24.x'

      - name: Verify against the live store
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          SHOPIFY_PRIMARY_DOMAIN: ${{ secrets.SHOPIFY_PRIMARY_DOMAIN }}
          VENNIX_LIVE_DISCOUNT_CODE: ${{ secrets.VENNIX_LIVE_DISCOUNT_CODE }}
        run: npm run verify:live
